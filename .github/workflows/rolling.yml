name: rolling
on:
  push:
    branches: [main]
concurrency:
  group: rolling-release
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build-gnu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: tar czf twyla-x86_64-unknown-linux-gnu.tar.gz -C target/release twyla
      - uses: actions/upload-artifact@v4
        with:
          name: twyla-x86_64-unknown-linux-gnu.tar.gz
          path: twyla-x86_64-unknown-linux-gnu.tar.gz

  build-musl:
    runs-on: ubuntu-latest
    container: alpine:3.21
    steps:
      - name: Install dependencies
        run: apk add --no-cache git curl build-base openssl-dev openssl-libs-static perl
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo build --release --locked
      - run: tar czf twyla-x86_64-unknown-linux-musl.tar.gz -C target/release twyla
      - uses: actions/upload-artifact@v4
        with:
          name: twyla-x86_64-unknown-linux-musl.tar.gz
          path: twyla-x86_64-unknown-linux-musl.tar.gz

  release:
    needs: [build-gnu, build-musl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest (main)" \
            --notes "Rolling build from $GITHUB_SHA" \
            artifacts/*.tar.gz
